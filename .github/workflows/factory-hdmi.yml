name: Qualify HDMI preparation and technician console
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - run: python3 scripts/package_factory_tools.py --check
      - name: Build and verify both modules without host access
        run: |
          for app in labox_boot_prepare labox_maintenance; do
            docker buildx build --platform linux/${{ matrix.arch }} --load -t "$app:qualification" "./$app"
            interpreter=python3
            if [ "$app" = labox_maintenance ]; then interpreter=/opt/maintenance/venv/bin/python; fi
            docker run --platform linux/${{ matrix.arch }} --rm --network none --read-only --tmpfs /tmp --mount type=bind,src="$PWD/scripts/qualify_factory_tools.py",dst=/test.py,readonly --entrypoint "$interpreter" "$app:qualification" /test.py "$app"
          done
      - name: Build the isolated private-bus session test
        run: docker build --builder default --platform linux/${{ matrix.arch }} -f scripts/Dockerfile.maintenance-test -t labox-maintenance:dbus-test .
      - name: Authenticate and expire simulated session on private D-Bus only
        run: docker run --platform linux/${{ matrix.arch }} --rm --network none --read-only --tmpfs /tmp labox-maintenance:dbus-test
      - name: Parse AppArmor profiles without loading policies
        run: |
          sudo apparmor_parser -Q -T labox_boot_prepare/apparmor.txt
          sudo apparmor_parser -Q -T labox_maintenance/apparmor.txt
