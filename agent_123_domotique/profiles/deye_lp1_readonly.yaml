    uom: W
    rule: 1
    registers:
    - 187
    icon: mdi:solar-power-variant
  - name: PV3 Power
    alt: DC3 Power
    mppt: 3
    class: power
    state_class: measurement
    uom: W
    rule: 1
    registers:
    - 188
    icon: mdi:solar-power-variant
  - name: PV4 Power
    alt: DC4 Power
