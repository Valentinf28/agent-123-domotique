# La Box — Deye SG0*LP1 basse tension, lecture seule.
# Source: ha-solarman v25.08.16, deye_hybrid.yaml.
# Entités de mesure uniquement ; aucun réglage exposé.
info:
  manufacturer: Deye
  model: SG0*LP1
default:
  update_interval: 60
  digits: 6
parameters:
- group: Info
  update_interval: 3600
  items:
  - name: Device
    class: enum
    rule: 1
    registers:
    - 0
    icon: mdi:information
    lookup:
    - key: 0
      value: Unknown
    - key:
      - 2
      - 512
      value: String Inverter
    - key:
      - 3
      - 768
      value: Single-Phase Hybrid Inverter
    - key:
      - 4
      - 1024
      value: Microinverter
    - key:
      - 5
      - 1280
      value: LV 3-Phase Hybrid Inverter
    - key: 6
      value: HV 3-Phase Hybrid Inverter
    - key:
      - 7
      - 1536
      value: HV 3-Phase Inverter 6-15kw
    - key:
      - 8
      - 1537
      value: HV 3-Phase Inverter 20-50kw
    attributes:
    - Device Modbus Address
    - Device Protocol Version
    - Device Serial Number
    - Device Rated Phase
    - Device Chip Type
    - Device Control Board Firmware Version
    - Device Communication Board Firmware Version
    - Device Rated Power
    - Device MPPTs
    - Device Phases
  - name: Device Modbus Address
    attribute: null
    rule: 1
    registers:
    - 1
  - name: Device Protocol Version
    attribute: null
    rule: 7
    remove: '0.'
    registers:
    - 2
  - name: Device Serial Number
    attribute: null
    rule: 5
    registers:
    - 3
    - 4
    - 5
    - 6
    - 7
  - name: Device Rated Phase
    attribute: null
    class: enum
    rule: 1
    registers:
    - 8
    lookup:
    - key:
      - 0
      - 1
      - 2
      value: Single-Phase
    - key: 3
      value: Three-Phase
    - key: 8
      value: Single-Phase Storage
  - name: Device Chip Type
    attribute: null
    class: enum
    rule: 1
    registers:
    - 9
    lookup:
    - key: 0
      value: AT32F403A
    - key: 1
      value: SXX32F103
    - key: 2
      value: GD32F103
    - key: 3
      value: GD32F303
  - name: Device Control Board Firmware Version
    attribute: null
    rule: 7
    delimiter: ''
    registers:
    - 13
    - 12
    - 11
  - name: Device Communication Board Firmware Version
    attribute: null
    rule: 7
    hex: null
    delimiter: ''
    registers:
    - 14
    - 10
  - name: Device Rated Power
    attribute: null
    class: power
    state_class: measurement
    uom: W
    scale: 0.1
    rule: 4
    registers:
    - 16
    - 17
    validation:
      min: 0
      max: 24000
  - name: Device MPPTs
    attribute: null
    rule: 1
    mask: 3840
    divide: 256
    registers:
    - 18
    range:
      min: 257
    validation:
      max: 12
      default: 2
  - name: Device Phases
    attribute: null
    rule: 1
    mask: 15
    registers:
    - 18
    range:
      min: 257
    validation:
      max: 3
      default: 3
- group: Control
  update_interval: 5
  items:
  - name: Device State
    class: enum
    update_interval: 10
    rule: 1
    registers:
    - 59
    icon: mdi:state-machine
    range:
      min: 0
      max: 5
    lookup:
    - key: 0
      value: Standby
    - key: 1
      value: Self-test
    - key: 2
      value: Normal
    - key: 3
      value: Alarm
    - key: 4
      value: Fault
  - name: Device Alarm
    class: enum
    rule: 3
    registers:
    - 101
    - 102
    icon: mdi:alert-outline
    lookup:
    - key: 0
      value: OK
    - bit: 1
      value: Fan failure
    - bit: 2
      value: Grid phase failure
    - bit: 3
      value: Meter communication failure
    - bit: 30
      value: Battery loss
    - bit: 31
      value: Parallel communication quality
    - key: default
      value: Problem
  - name: Device Fault
    class: enum
    rule: 3
    registers:
    - 103
    - 104
    - 105
    - 106
    icon: mdi:message-alert-outline
    lookup:
    - key: 0
      value: OK
    - bit: 6
      value: DC/DC Soft Start failure
    - bit: 9
      value: Auxiliary power supply failure
    - bit: 12
      value: Working mode changed
    - bit: 17
      value: AC Over-current failure
    - bit: 18
      value: Tz_Integ_Fault failure
    - bit: 19
      value: DC Over-current failure
    - bit: 22
      value: AC current leakage failure
    - bit: 63
      value: Temperature is too high
    - key: default
      value: Problem
- group: PV
  update_interval: 5
  items:
  - name: PV Power
    alt: DC Power
