    - 74
    - 75
    icon: mdi:battery-minus
    validation:
      min: 0.1
  - name: Today Energy Import
    alt: Today Energy Bought
    friendly_name: Today's Energy Import
    class: energy
    state_class: total_increasing
    uom: kWh
    scale: 0.1
    rule: 1
    registers:
    - 76
    icon: mdi:transmission-tower-export
  - name: Today Energy Export
    alt: Today Energy Sold
    friendly_name: Today's Energy Export
    class: energy
    state_class: total_increasing
    uom: kWh
    scale: 0.1
    rule: 1
    registers:
    - 77
    icon: mdi:transmission-tower-import
  - name: Total Energy Import
    alt: Total Energy Bought
    class: energy
    state_class: total_increasing
    uom: kWh
    scale: 0.1
    rule: 1
    registers:
    - 78
    - 80
    icon: mdi:transmission-tower-export
    validation:
      min: 0.1
  - name: Total Energy Export
    alt: Total Energy Sold
    class: energy
    state_class: total_increasing
    uom: kWh
    scale: 0.1
    rule: 3
    registers:
    - 81
    - 82
    icon: mdi:transmission-tower-import
    validation:
      min: 0.1
  - name: Today Load Consumption
    friendly_name: Today's Load Consumption
    class: energy
    state_class: total_increasing
    uom: kWh
    scale: 0.1
    rule: 1
    registers:
    - 84
  - name: Total Load Consumption
    class: energy
    state_class: total_increasing
    uom: kWh
    scale: 0.1
    rule: 3
    registers:
    - 85
    - 86
    validation:
      min: 0.1
  - name: Generator Energy - today
    name_lookup: io_mode_select
    class: energy
    state_class: total_increasing
    uom: kWh
    scale: 0.1
    rule: 1
    registers:
    - 62
  - name: Generator Energy
    name_lookup: io_mode_select
    class: energy
    state_class: total_increasing
    uom: kWh
    scale: 0.1
    rule: 3
    registers:
    - 92
    - 95
    validation:
      min: 0.1
  - name: Today Production
    friendly_name: Today's Production
    class: energy
    state_class: total_increasing
    uom: kWh
    scale: 0.1
    rule: 1
    registers:
    - 108
    icon: mdi:solar-power
    validation:
      dev: 100
      invalidate_all: null
  - name: Total Production
    class: energy
    state_class: total_increasing
    uom: kWh
    scale: 0.1
    rule: 3
    registers:
    - 96
    - 97
    icon: mdi:solar-power
    validation:
      min: 0.1
      dev: 100
      invalidate_all: 2
  - name: Today Losses
    alt: Daily Losses
    friendly_name: Today's Losses
    description: Includes today's consumption of the inverter device itself as well
      AC/DC conversion losses
    class: energy
    state_class: total_increasing
    ensure_increasing: null
    uom: kWh
    rule: 1
    digits: 1
    scale: 0.1
    uint: enforce
    sensors:
    - registers:
      - 76
    - registers:
      - 108
    - registers:
      - 62
      enabled_lookup:
        io_mode_select:
        - Generator
        - Microinverter
    - registers:
      - 71
    - operator: subtract
      registers:
      - 77
    - operator: subtract
      registers:
      - 70
    - operator: subtract
      registers:
      - 84
  - name: Total Losses
    description: Includes total consumption of the inverter device itself as well
      AC/DC conversion losses
    class: energy
    state_class: total_increasing
    ensure_increasing: null
    uom: kWh
    rule: 3
    digits: 1
    scale: 0.1
    uint: enforce
    sensors:
    - registers:
      - 78
      - 80
    - registers:
      - 96
      - 97
    - registers:
      - 92
      - 95
      enabled_lookup:
        io_mode_select:
        - Generator
        - Microinverter
    - registers:
      - 74
      - 75
    - operator: subtract
      registers:
      - 81
      - 82
    - operator: subtract
      registers:
      - 72
      - 73
    - operator: subtract
      registers:
      - 85
      - 86
    validation:
      min: 1
