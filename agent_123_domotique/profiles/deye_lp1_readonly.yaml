    class: power
    state_class: measurement
    uom: W
    rule: 1
    registers:
    - 189
    icon: mdi:solar-power-variant
- group: Meter
  update_interval: 30
  items:
  - name: Today Energy
    alt: Daily Energy
    friendly_name: Today's Energy
    class: energy
    state_class: total_increasing
    uom: kWh
    scale: 0.1
    rule: 2
    registers:
    - 60
  - name: Total Energy
    class: energy
    state_class: total_increasing
    uom: kWh
    scale: 0.1
    rule: 4
    registers:
    - 63
    - 64
    validation:
      min: 0.1
  - name: Today Battery Charge
    friendly_name: Today's Battery Charge
    class: energy
    state_class: total_increasing
    uom: kWh
    scale: 0.1
    rule: 1
    registers:
    - 70
    icon: mdi:battery-plus
  - name: Today Battery Discharge
    friendly_name: Today's Battery Discharge
    class: energy
    state_class: total_increasing
    uom: kWh
    scale: 0.1
    rule: 1
    registers:
    - 71
    icon: mdi:battery-minus
  - name: Total Battery Charge
    class: energy
    state_class: total_increasing
    uom: kWh
    scale: 0.1
    rule: 3
    registers:
    - 72
    - 73
    icon: mdi:battery-plus
