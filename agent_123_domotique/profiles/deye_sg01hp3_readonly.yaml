#
# 1.2.3. Home — Deye SG01HP3 en lecture seule
#
# Généré depuis le profil deye_p3.yaml de ha-solarman v25.08.16.
# Seules les entités de mesure et les capteurs binaires sont conservés.
# Aucun number, select, switch, time ou datetime n’est exposé.
#
---
info:
  manufacturer: Deye
  model:
  - SG0*LP3
  - SG0*HP3
default:
  update_interval: 60
  digits: 6
parameters:
- group: Info
  update_interval: 3600
  items:
  - name: Device
    class: enum
    rule: 1
    registers:
    - 0
    icon: mdi:information
    lookup:
    - key: 0
      value: Unknown
    - key:
      - 2
      - 512
      value: String Inverter
    - key:
      - 3
      - 768
      value: Single-Phase Hybrid Inverter
    - key:
      - 4
      - 1024
      value: Microinverter
    - key:
      - 5
      - 1280
      value: LV 3-Phase Hybrid Inverter
    - key: 6
      value: HV 3-Phase Hybrid Inverter
    - key:
      - 7
      - 1536
      value: HV 3-Phase Inverter 6-15kw
    - key:
      - 8
      - 1537
      value: HV 3-Phase Inverter 20-50kw
    attributes:
    - Device Modbus Address
    - Device Protocol Version
    - Device Serial Number
    - Device Control Board Firmware Version
    - Device Communication Board Firmware Version
    - Device MCU Board Version
    - Device MCU Version
    - Device AFCI Version
    - Device Rated Power
    - Device MPPTs
    - Device Phases
  - name: Device Modbus Address
    attribute:
    rule: 1
    registers:
    - 1
  - name: Device Protocol Version
    attribute:
    rule: 7
    remove: '0.'
    registers:
    - 2
  - name: Device Serial Number
    attribute:
    rule: 5
    registers:
    - 3
    - 4
    - 5
    - 6
    - 7
  - name: Device MCU Board Version
    attribute:
    rule: 7
    delimiter: ''
    registers:
    - 10
  - name: Device AFCI Version
    attribute:
    rule: 7
    delimiter: ''
    registers:
    - 12
  - name: Device MCU Version
    attribute:
    rule: 7
    delimiter: ''
    registers:
    - 13
  - name: Device Control Board Firmware Version
    attribute:
    rule: 7
    delimiter: ''
    registers:
    - 14
    - 15
    - 11
  - name: Device Communication Board Firmware Version
    attribute:
    rule: 7
    hex:
    delimiter: ''
    registers:
    - 17
    - 18
    - 16
  - name: Device Rated Power
    attribute:
    class: power
    state_class: measurement
    uom: W
    scale: 0.1
    rule: 4
    registers:
    - 20
    - 21
    validation:
      min: 0
      max:
      - 24000
      - 80000
  - name: Device MPPTs
    attribute:
    rule: 1
    mask: 3840
    divide: 256
    registers:
    - 22
    range:
      min: 257
    validation:
      max: 12
      default: 2
  - name: Device Phases
    attribute:
    rule: 1
    mask: 15
    registers:
    - 22
    range:
      min: 257
    validation:
      max: 3
      default: 3
  - name: Device Self-check
    attribute:
    class: enum
    rule: 1
    registers:
    - 36
    range:
      min: 0
      max: 1
    lookup:
    - key: 0
      value: Disabled
    - key: 1
      value: Enabled
- group: BMS
  items:
  - name: Battery BMS Charging Voltage
    attribute:
    class: voltage
    state_class: measurement
    uom: V
    scale:
    - 0.01
    - 0.1
    rule: 1
    registers:
    - 210
  - name: Battery BMS Discharging Voltage
    attribute:
    class: voltage
    state_class: measurement
    uom: V
    scale:
    - 0.01
    - 0.1
    rule: 1
    registers:
    - 211
  - name: Battery BMS Charging Current
    attribute:
    class: current
    state_class: measurement
    uom: A
    rule: 1
    registers:
    - 212
    icon: mdi:current-dc
  - name: Battery BMS Discharging Current
    attribute:
    class: current
    state_class: measurement
    uom: A
    rule: 1
    registers:
    - 213
    icon: mdi:current-dc
  - name: Battery BMS SOC
    attribute:
    state_class: measurement
    uom: "%"
    rule: 1
    registers:
    - 214
    icon: mdi:battery
    validation:
      min: 0
      max: 101
  - name: Battery BMS Voltage
    attribute:
    class: voltage
    state_class: measurement
    uom: V
    scale:
    - 0.01
    - 0.1
    rule: 1
    registers:
    - 215
  - name: Battery BMS Current
    attribute:
    class: current
    state_class: measurement
    uom: A
    scale:
    - 1
    - 0.1
    rule: 2
    registers:
    - 216
    icon: mdi:current-dc
  - name: Battery BMS Max Charging Current
    attribute:
    class: current
    state_class: measurement
    uom: A
    rule: 1
    registers:
    - 218
    icon: mdi:current-dc
  - name: Battery BMS Max Discharging Current
    attribute:
    class: current
    state_class: measurement
    uom: A
    rule: 1
    registers:
    - 219
    icon: mdi:current-dc
  - name: Battery Alarm
    platform: binary_sensor
    class: problem
    rule: 1
    registers:
    - 220
    icon: mdi:battery-alert
    attributes:
    - value
  - name: Battery Fault
    platform: binary_sensor
    class: problem
    rule: 1
    registers:
    - 221
    icon: mdi:battery-alert-variant
    range:
      min: 0
      max: 65535
    attributes:
    - value
  - name: Battery BMS Other Symbol
    attribute:
    rule: 1
    registers:
    - 222
    icon: mdi:battery-unknown
    range:
      min: 0
      max: 65535
- group: Meter
  update_interval: 30
  items:
  - name: Today Battery Charge
    alt: Daily Battery Charge
    friendly_name: Today's Battery Charge
    class: energy
    state_class: total_increasing
    uom: kWh
    scale: 0.1
    rule: 1
    registers:
    - 514
    icon: mdi:battery-plus
  - name: Today Battery Discharge
    alt: Daily Battery Discharge
    friendly_name: Today's Battery Discharge
    class: energy
    state_class: total_increasing
    uom: kWh
    scale: 0.1
    rule: 1
    registers:
    - 515
    icon: mdi:battery-minus
  - name: Total Battery Charge
    class: energy
    state_class: total_increasing
    uom: kWh
    scale: 0.1
    rule: 3
    registers:
    - 516
    - 517
    icon: mdi:battery-plus
    validation:
      min: 0.1
  - name: Total Battery Discharge
    class: energy
    state_class: total_increasing
    uom: kWh
    scale: 0.1
    rule: 3
    registers:
    - 518
    - 519
    icon: mdi:battery-minus
    validation:
      min: 0.1
  - name: Today Battery Life Cycles
    alt: Daily Battery Life Cycles
    friendly_name: Today's Battery Life Cycles
    description: Calculates today's battery life cycles based on today's charged amount
    state_class: total_increasing
    rule: 0
    digits: 2
    icon: mdi:battery-sync
  - name: Total Battery Life Cycles
    description: Calculates total battery life cycles based on total charged amount
    state_class: total_increasing
    rule: 0
    digits: 2
    icon: mdi:battery-sync
    validation:
      min: 0.1
  - name: Today Energy Import
    alt: Daily Energy Bought
    friendly_name: Today's Energy Import
    description: Today's energy imported from the grid
    class: energy
    state_class: total_increasing
    uom: kWh
    scale: 0.1
    rule: 1
    registers:
    - 520
    icon: mdi:transmission-tower-export
  - name: Today Energy Export
    alt: Daily Energy Sold
    friendly_name: Today's Energy Export
    description: Today's energy exported/returned to the grid
    class: energy
    state_class: total_increasing
    uom: kWh
    scale: 0.1
    rule: 1
    registers:
    - 521
    icon: mdi:transmission-tower-import
  - name: Total Energy Import
    alt: Total Energy Bought
    description: Total energy imported from the grid
    class: energy
    state_class: total_increasing
    uom: kWh
    scale: 0.1
    rule: 3
    registers:
    - 522
    - 523
    icon: mdi:transmission-tower-export
    validation:
      min: 0.1
  - name: Total Energy Export
    alt: Total Energy Sold
    description: Total energy exported/returned to the grid
    class: energy
    state_class: total_increasing
    uom: kWh
    scale: 0.1
    rule: 3
    registers:
    - 524
    - 525
    icon: mdi:transmission-tower-import
    validation:
      min: 0.1
  - name: Today Load Consumption
    alt: Daily Load Consumption
    friendly_name: Today's Load Consumption
    class: energy
    state_class: total_increasing
    uom: kWh
    scale: 0.1
    rule: 1
    registers:
    - 526
  - name: Total Load Consumption
    class: energy
    state_class: total_increasing
    uom: kWh
    scale: 0.1
    rule: 3
    registers:
    - 527
    - 528
    validation:
      min: 0.1
  - name: Today Production
    alt: Daily Production
    friendly_name: Today's Production
    class: energy
    state_class: total_increasing
    uom: kWh
    scale: 0.1
    rule: 1
    registers:
    - 529
    icon: mdi:solar-power
    validation:
      dev: 100
      invalidate_all: 2
  - name: Total Production
    class: energy
    state_class: total_increasing
    uom: kWh
    scale: 0.1
    rule: 3
    registers:
    - 534
    - 535
    icon: mdi:solar-power
    validation:
      min: 0.1
      dev: 100
      invalidate_all: 2
  - name: DC Temperature
    hidden:
    class: temperature
    state_class: measurement
    uom: "°C"
    scale: 0.1
    rule: 2
    offset: 1000
    registers:
    - 540
    icon: mdi:thermometer
    range:
      min: 0
      max: 3000
  - name: Temperature
    class: temperature
    state_class: measurement
    uom: "°C"
    scale: 0.1
    rule: 2
    offset: 1000
    registers:
    - 541
    icon: mdi:thermometer
    range:
      min: 0
      max: 3000
- group: State
  update_interval: 30
  items:
  - name: Device State
    class: enum
    rule: 1
    registers:
    - 500
    icon: mdi:state-machine
    range:
      min: 0
      max: 5
    lookup:
    - key: 0
      value: Standby
    - key: 1
      value: Self-test
    - key: 2
      value: Normal
    - key: 3
      value: Alarm
    - key: 4
      value: Fault
  - name: ''
    platform: binary_sensor
    device_class: running
    rule: 1
    registers:
    - 551
  - name: Device Relay
    class: enum
    rule: 1
    registers:
    - 552
    icon: mdi:directions-fork
    lookup:
    - key: 0
      value: 'Off'
    - key:
      - 1
      - 3
      value: Inverter
    - key:
      - 4
      - 6
      value: Grid
    - key:
      - 5
      - 7
      value: Inverter-Grid
    - key: 8
      value: Generator
    - key:
      - 9
      - 11
      value: Inverter-Gen
    - key:
      - 12
      - 14
      value: Grid-Generator
    - key:
      - 13
      - 15
      value: Inv-Grid-Gen
    - key: default
      value: Power Supply
  - name: Grid
    platform: binary_sensor
    device_class: power
    rule: 1
    registers:
    - 552
    bit: 2
    icon: mdi:transmission-tower
  - name: Device Alarm
    class: enum
    rule: 3
    registers:
    - 553
    - 554
    icon: mdi:alert-outline
    lookup:
    - key: 0
      value: OK
    - bit: 1
      value: Fan failure
    - bit: 2
      value: Grid phase failure
    - bit: 3
      value: Meter communication failure
    - bit: 30
      value: Battery loss
    - bit: 31
      value: Parallel communication quality
    - key: default
      value: Problem
  - name: Device Fault
    class: enum
    rule: 3
    registers:
    - 555
    - 556
    - 557
    - 558
    icon: mdi:message-alert-outline
    lookup:
    - key: 0
      value: OK
    - bit: 6
      value: DC/DC Soft Start failure
    - bit: 9
      value: Auxiliary power supply failure
    - bit: 12
      value: Working mode changed
    - bit: 17
      value: AC Over-current failure
    - bit: 18
      value: Tz_Integ_Fault failure
    - bit: 19
      value: DC Over-current failure
    - bit: 22
      value: AC current leakage failure
    - bit: 63
      value: Temperature is too high
    - key: default
      value: Problem
- group: Battery
  update_interval: 5
  items:
  - name: Battery Temperature
    class: temperature
    state_class: measurement
    uom: "°C"
    scale: 0.1
    rule: 1
    offset: 1000
    registers:
    - 586
    range:
      min: 0
      max: 3000
    validation:
      min: -99
      max: 99
  - name: Battery Voltage
    class: voltage
    state_class: measurement
    uom: V
    scale:
    - 0.01
    - 0.1
    rule: 1
    registers:
    - 587
  - name: Battery
    class: battery
    state_class: measurement
    uom: "%"
    rule: 1
    registers:
    - 588
    range:
      min: 0
      max: 100
    validation:
      min: 0
      max: 101
    attributes:
    - Battery Corrected Capacity
    - Battery BMS SOC
    - Battery BMS Current
    - Battery BMS Voltage
    - Battery BMS Other Symbol
    - Battery BMS Charging Voltage
    - Battery BMS Discharging Voltage
    - Battery BMS Charging Current
    - Battery BMS Discharging Current
    - Battery BMS Max Charging Current
    - Battery BMS Max Discharging Current
  - name: Battery Power
    class: power
    state_class: measurement
    uom: W
    scale:
    - 1
    - 10
    rule: 2
    registers:
    - 590
    attributes:
    - inverse
  - name: Battery SOH
    description: Calculates state of health based on total charged amount
    state_class: measurement
    uom: "%"
    rule: 0
    digits: 2
    icon: mdi:battery-heart
  - name: Battery Capacity
    description: Estimates capacity of the battery during (dis)charging
    class: energy_storage
    state_class: measurement
    uom: kWh
    rule: 0
    digits: 1
    icon: mdi:battery-check
  - name: Battery State
    description: Determines battery state from battery power by +-50 W
    class: enum
    rule: 0
    options:
    - charging
    - idle
    - discharging
    icon: mdi:battery
  - name: Battery Current
    class: current
    state_class: measurement
    uom: A
    scale: 0.01
    rule: 2
    sensors:
    - signed:
      registers:
      - 591
    - signed:
      registers:
      - 594
    icon: mdi:current-dc
  - name: Battery Corrected Capacity
    attribute:
    state_class: measurement
    uom: Ah
    rule: 1
    registers:
    - 592
    icon: mdi:battery
    range:
      min: 0
      max: 3000
- group: Grid
  update_interval: 5
  items:
  - name: Grid L1 Voltage
    l: 1
    class: voltage
    state_class: measurement
    uom: V
    scale: 0.1
    rule: 1
    registers:
    - 598
    icon: mdi:transmission-tower
  - name: Grid L2 Voltage
    l: 2
    class: voltage
    state_class: measurement
    uom: V
    scale: 0.1
    rule: 1
    registers:
    - 599
    icon: mdi:transmission-tower
  - name: Grid L3 Voltage
    l: 3
    class: voltage
    state_class: measurement
    uom: V
    scale: 0.1
    rule: 1
    registers:
    - 600
    icon: mdi:transmission-tower
  - name: Internal CT1 Power
    l: 1
    class: power
    state_class: measurement
    uom: W
    rule: 4
    registers:
    - 604
    - 700
    icon: mdi:transmission-tower
  - name: Internal CT2 Power
    l: 2
    class: power
    state_class: measurement
    uom: W
    rule: 4
    registers:
    - 605
    - 701
    icon: mdi:transmission-tower
  - name: Internal CT3 Power
    l: 3
    class: power
    state_class: measurement
    uom: W
    rule: 4
    registers:
    - 606
    - 702
    icon: mdi:transmission-tower
  - name: Internal Power
    l: 1
    class: power
    state_class: measurement
    uom: W
    rule: 4
    registers:
    - 607
    - 703
    icon: mdi:transmission-tower
  - name: Grid Frequency
    l: 1
    class: frequency
    state_class: measurement
    uom: Hz
    scale: 0.01
    rule: 1
    registers:
    - 609
  - name: Internal CT1 Current
    l: 1
    class: current
    state_class: measurement
    uom: A
    scale: 0.01
    rule: 2
    registers:
    - 610
    icon: mdi:transmission-tower
  - name: Internal CT2 Current
    l: 2
    class: current
    state_class: measurement
    uom: A
    scale: 0.01
    rule: 2
    registers:
    - 611
    icon: mdi:transmission-tower
  - name: Internal CT3 Current
    l: 3
    class: current
    state_class: measurement
    uom: A
    scale: 0.01
    rule: 2
    registers:
    - 612
    icon: mdi:transmission-tower
  - name: External CT1 Current
    l: 1
    class: current
    state_class: measurement
    uom: A
    scale: 0.01
    rule: 2
    registers:
    - 613
    icon: mdi:transmission-tower
  - name: External CT2 Current
    l: 2
    class: current
    state_class: measurement
    uom: A
    scale: 0.01
    rule: 2
    registers:
    - 614
    icon: mdi:transmission-tower
  - name: External CT3 Current
    l: 3
    class: current
    state_class: measurement
    uom: A
    scale: 0.01
    rule: 2
    registers:
    - 615
    icon: mdi:transmission-tower
  - name: External CT1 Power
    l: 1
    class: power
    state_class: measurement
    uom: W
    rule: 4
    registers:
    - 616
    - 705
    icon: mdi:transmission-tower
  - name: External CT2 Power
    l: 2
    class: power
    state_class: measurement
    uom: W
    rule: 4
    registers:
    - 617
    - 706
    icon: mdi:transmission-tower
  - name: External CT3 Power
    l: 3
    class: power
    state_class: measurement
    uom: W
    rule: 4
    registers:
    - 618
    - 707
    icon: mdi:transmission-tower
  - name: External Power
    l: 1
    class: power
    state_class: measurement
    uom: W
    rule: 4
    registers:
    - 619
    - 708
    icon: mdi:transmission-tower
  - name: Grid L1 Power
    l: 1
    class: power
    state_class: measurement
    uom: W
    rule: 4
    registers:
    - 622
    - 687
    icon: mdi:transmission-tower
  - name: Grid L2 Power
    l: 2
    class: power
    state_class: measurement
    uom: W
    rule: 4
    registers:
    - 623
    - 688
    icon: mdi:transmission-tower
  - name: Grid L3 Power
    l: 3
    class: power
    state_class: measurement
    uom: W
    rule: 4
    registers:
    - 624
    - 689
    icon: mdi:transmission-tower
  - name: Grid Power
    l: 1
    description: Combined power of all three phases
    class: power
    state_class: measurement
    uom: W
    rule: 4
    registers:
    - 625
    - 690
    icon: mdi:transmission-tower
    attributes:
    - inverse
- group: Output
  update_interval: 5
  items:
  - name: Output L1 Voltage
    l: 1
    class: voltage
    state_class: measurement
    uom: V
    scale: 0.1
    rule: 1
    registers:
    - 627
  - name: Output L2 Voltage
    l: 2
    class: voltage
    state_class: measurement
    uom: V
    scale: 0.1
    rule: 1
    registers:
    - 628
  - name: Output L3 Voltage
    l: 3
    class: voltage
    state_class: measurement
    uom: V
    scale: 0.1
    rule: 1
    registers:
    - 629
  - name: Output L1 Current
    l: 1
    class: current
    state_class: measurement
    uom: A
    scale: 0.01
    rule: 2
    registers:
    - 630
  - name: Output L2 Current
    l: 2
    class: current
    state_class: measurement
    uom: A
    scale: 0.01
    rule: 2
    registers:
    - 631
  - name: Output L3 Current
    l: 3
    class: current
    state_class: measurement
    uom: A
    scale: 0.01
    rule: 2
    registers:
    - 632
  - name: Output L1 Power
    l: 1
    class: power
    state_class: measurement
    uom: W
    rule: 4
    registers:
    - 633
    - 691
  - name: Output L2 Power
    l: 2
    class: power
    state_class: measurement
    uom: W
    rule: 4
    registers:
    - 634
    - 692
  - name: Output L3 Power
    l: 3
    class: power
    state_class: measurement
    uom: W
    rule: 4
    registers:
    - 635
    - 693
  - name: Power
    alt: Output Power
    class: power
    state_class: measurement
    uom: W
    rule: 4
    registers:
    - 636
    - 694
  - name: Power losses
    description: Includes consumption of the inverter device itself as well AC/DC
      conversion losses
    class: power
    state_class: measurement
    uom: W
    rule: 1
    digits: 0
    scale:
    - 1
    - 10
    uint: enforce
    sensors:
    - signed:
      registers:
      - 590
    - registers:
      - 672
    - registers:
      - 673
    - registers:
      - 674
    - registers:
      - 675
    - operator: subtract
      signed:
      scale: 1
      registers:
      - 636
      - 694
  - name: Output Frequency
    l: 1
    class: frequency
    state_class: measurement
    uom: Hz
    scale: 0.01
    rule: 1
    registers:
    - 638
- group: UPS
  update_interval: 5
  items:
  - name: Load UPS L1 Power
    l: 1
    hidden:
    class: power
    state_class: measurement
    uom: W
    rule: 4
    registers:
    - 640
    - 696
    icon: mdi:home-lightning-bolt
  - name: Load UPS L2 Power
    l: 2
    hidden:
    class: power
    state_class: measurement
    uom: W
    rule: 4
    registers:
    - 641
    - 697
    icon: mdi:home-lightning-bolt
  - name: Load UPS L3 Power
    l: 3
    hidden:
    class: power
    state_class: measurement
    uom: W
    rule: 4
    registers:
    - 642
    - 698
    icon: mdi:home-lightning-bolt
  - name: Load UPS Power
    l: 1
    hidden:
    class: power
    state_class: measurement
    uom: W
    rule: 4
    registers:
    - 643
